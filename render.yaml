services:
  - type: web
    name: mp-cyber
    runtime: node
    plan: free
    region: oregon
    buildCommand: yarn && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: mp-cyber
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
